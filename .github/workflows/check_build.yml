name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    name: Build, Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none, riscv64gc-unknown-none-elf

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter (x86_64)
        run: cargo clippy --target=x86_64-unknown-none -- -D warnings

      - name: Run linter (RISC-V)
        run: cargo clippy --target=riscv64gc-unknown-none-elf -- -D warnings

      - name: Build project (x86_64)
        run: cargo build --target=x86_64-unknown-none --verbose

      - name: Build project (RISC-V)
        run: cargo build --target=riscv64gc-unknown-none-elf --verbose
